<svg xmlns="http://www.w3.org/2000/svg" width="824" height="250" viewBox="0 0 824 250" role="img" aria-label="nepalqr: Turns a merchant's free static NepalQR into a dynamic QR that carries the amount">
<title>nepalqr: Turns a merchant's free static NepalQR into a dynamic QR that carries the amount</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
<rect x=".75" y=".75" width="822.5" height="248.5" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<rect x="28" y="28" width="56" height="56" rx="14" fill="rgba(34,211,238,0.12)"/>
<g transform="translate(40 40) scale(1.33)" fill="none" stroke="#22d3ee" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" color="#22d3ee"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2"/><path d="M14 14h2.5v2.5H14zM20.5 14v2.5M14 20.5h2.5M18.5 18.5h2v2"/></g>
<text x="100" y="58" font-size="26" font-weight="700" fill="#f0f6fc">nepalqr</text>
<text class="mono" x="101" y="80" font-size="11.5" letter-spacing=".8" fill="#22d3ee">PAYMENTS IN NEPAL</text>
<text x="28" y="120" font-size="16" fill="#9198a1">Turns a merchant's free static NepalQR into a</text>
<text x="28" y="143" font-size="16" fill="#9198a1">dynamic QR that carries the amount</text>
<rect x="28" y="164" width="400" height="34" rx="8" fill="#0d1117" stroke="#3d444d"/>
<g transform="translate(42 173) scale(0.67)" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#22d3ee"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9M12 3c-2.6 2.6-3.8 5.6-3.8 9s1.2 6.4 3.8 9"/></g><text class="mono" x="66" y="186" font-size="13" fill="#f0f6fc">anishbhattarai-asm.github.io/nepalqr</text>
<circle cx="33" cy="224.5" r="5.5" fill="#f1e05a"/><text x="45" y="229" font-size="13" fill="#9198a1">JavaScript</text><text x="133.95" y="229" font-size="13" fill="#9198a1">Zero dependencies</text><text x="271.52" y="229" font-size="13" fill="#9198a1">Works offline</text>
<rect x="456" y="24" width="344" height="202" rx="12" fill="#0d1117" stroke="#3d444d"/>
<text class="mono" x="478" y="54" font-size="12" letter-spacing=".6" fill="#9198a1">HOW IT WORKS</text>
<path d="M490 86V168" stroke="#3d444d" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="490" cy="86" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="90.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">1</text>
<text x="514" y="84" font-size="14" font-weight="700" fill="#f0f6fc">Decode</text>
<text x="514" y="101" font-size="12.5" fill="#9198a1">Reads the merchant's static QR</text>
<circle cx="490" cy="127" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="131.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">2</text>
<text x="514" y="125" font-size="14" font-weight="700" fill="#f0f6fc">Set the amount</text>
<text x="514" y="142" font-size="12.5" fill="#9198a1">Marks it dynamic, recomputes the checksum</text>
<circle cx="490" cy="168" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="172.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">3</text>
<text x="514" y="166" font-size="14" font-weight="700" fill="#f0f6fc">Scan</text>
<text x="514" y="183" font-size="12.5" fill="#9198a1">The customer sees the amount filled in</text>
<text x="478" y="208" font-size="12.5" fill="#9198a1">No payment aggregator, no integration fees.</text>
</svg>
