<g transform="translate(40 40) scale(1.33)" fill="none" stroke="#22d3ee" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" color="#22d3ee"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></g>
<text x="100" y="58" font-size="26" font-weight="700" fill="#f0f6fc">Stream Panel</text>
<text class="mono" x="101" y="80" font-size="11.5" letter-spacing=".8" fill="#22d3ee">VIDEO AND STREAMING</text>
<text x="28" y="120" font-size="16" fill="#9198a1">Runs a 24/7 YouTube live stream from your videos</text>
<text x="28" y="143" font-size="16" fill="#9198a1">or a lofi playlist on a free server</text>
<rect x="28" y="164" width="400" height="34" rx="8" fill="#0d1117" stroke="#3d444d"/>
<text x="42" y="186" font-size="13.5" fill="#f0f6fc">Oracle Cloud free tier · OBS · FFmpeg</text>
<circle cx="33" cy="224.5" r="5.5" fill="#f1e05a"/><text x="45" y="229" font-size="13" fill="#9198a1">JavaScript</text><text x="133.95" y="229" font-size="13" fill="#9198a1">Self-hosted</text><text x="226.41" y="229" font-size="13" fill="#9198a1">Discord alerts</text>
<rect x="456" y="24" width="344" height="202" rx="12" fill="#0d1117" stroke="#3d444d"/>
<text class="mono" x="478" y="54" font-size="12" letter-spacing=".6" fill="#9198a1">HOW IT WORKS</text>
<path d="M490 86V168" stroke="#3d444d" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="490" cy="86" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="90.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">1</text>
<text x="514" y="84" font-size="14" font-weight="700" fill="#f0f6fc">Upload</text>
<text x="514" y="101" font-size="12.5" fill="#9198a1">Videos, or a lofi image and music tracks</text>
<circle cx="490" cy="127" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="131.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">2</text>
<text x="514" y="125" font-size="14" font-weight="700" fill="#f0f6fc">Stream</text>
<text x="514" y="142" font-size="12.5" fill="#9198a1">Around the clock, resuming after drops</text>
<circle cx="490" cy="168" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="172.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">3</text>
<text x="514" y="166" font-size="14" font-weight="700" fill="#f0f6fc">Control</text>
<text x="514" y="183" font-size="12.5" fill="#9198a1">From your phone, even while live</text>
<text x="478" y="208" font-size="12.5" fill="#9198a1">Also streams to Twitch, Kick or Facebook.</text>
