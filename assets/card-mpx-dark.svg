<rect x="28" y="164" width="400" height="34" rx="8" fill="#0d1117" stroke="#3d444d"/>
<text class="mono" x="42" y="186" font-size="13" fill="#f0f6fc">from mtpx import SlideScene, slide</text>
<circle cx="33" cy="224.5" r="5.5" fill="#3572a5"/><text x="45" y="229" font-size="13" fill="#9198a1">Python</text><text x="109.51" y="229" font-size="13" fill="#9198a1">Manim</text><text x="172.2" y="229" font-size="13" fill="#9198a1">python-pptx</text><text x="266.87" y="229" font-size="13" fill="#9198a1">FFmpeg</text>
<rect x="456" y="24" width="344" height="202" rx="12" fill="#0d1117" stroke="#3d444d"/>
<text class="mono" x="478" y="54" font-size="12" letter-spacing=".6" fill="#9198a1">HOW IT WORKS</text>
<path d="M490 86V168" stroke="#3d444d" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="490" cy="86" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="90.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">1</text>
<text x="514" y="84" font-size="14" font-weight="700" fill="#f0f6fc">@slide</text>
<text x="514" y="101" font-size="12.5" fill="#9198a1">Each method is one click</text>
<circle cx="490" cy="127" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="131.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">2</text>
<text x="514" y="125" font-size="14" font-weight="700" fill="#f0f6fc">Render</text>
<text x="514" y="142" font-size="12.5" fill="#9198a1">All slides share one Manim scene</text>
<circle cx="490" cy="168" r="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="490" y="172.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22d3ee">3</text>
<text x="514" y="166" font-size="14" font-weight="700" fill="#f0f6fc">Present</text>
