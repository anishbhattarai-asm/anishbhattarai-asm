<rect x="28" y="28" width="56" height="56" rx="14" fill="rgba(34,211,238,0.12)"/>
<g transform="translate(40 40) scale(1.33)" fill="none" stroke="#22d3ee" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" color="#22d3ee"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M12 16.5V20M8.5 20h7"/><path d="M10.3 7.8v5l4-2.5z"/></g>
<text x="100" y="58" font-size="26" font-weight="700" fill="#f0f6fc">MTPX</text>
<text class="mono" x="101" y="80" font-size="11.5" letter-spacing=".8" fill="#22d3ee">MATH AND ANIMATION</text>
<text x="28" y="120" font-size="16" fill="#9198a1">Manim animations as Python methods, exported as</text>
